# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Astro Doctor
description: Your agent writes bad Astro. This catches it.
author: santi020k

inputs:
  working-directory:
    description: Directory to scan (defaults to repo root)
    required: false
    default: '.'
  fail-on:
    description: Minimum severity to fail the check (error | warning | off)
    required: false
    default: 'error'
  min-score:
    description: Minimum health score required to pass (0–100)
    required: false
    default: '0'
  comment:
    description: Post a sticky summary comment on pull requests (true | false)
    required: false
    default: 'true'
  diff-only:
    description: On PRs, report only diagnostics introduced by this PR (true | false)
    required: false
    default: 'true'
  json-report:
    description: Path to write a JSON report (leave empty to skip)
    required: false
    default: ''
  sarif-report:
    description: Path to write a SARIF 2.1.0 report (leave empty to skip)
    required: false
    default: ''
  upload-sarif:
    description: Upload SARIF findings to GitHub Code Scanning (true | false)
    required: false
    default: 'false'

outputs:
  total:
    description: Total number of diagnostics found
    value: ${{ steps.report.outputs.total }}
  errors:
    description: Number of error-severity diagnostics
    value: ${{ steps.report.outputs.errors }}
  warnings:
    description: Number of warning-severity diagnostics
    value: ${{ steps.report.outputs.warnings }}
  score:
    description: Health score 0–100
    value: ${{ steps.report.outputs.score }}
  score-label:
    description: Health score letter grade (S, A–F)
    value: ${{ steps.report.outputs.score_label }}

runs:
  using: 'composite'
  steps:
    - name: Setup supported Node.js runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.16.0'

    - name: Prepare scan
      id: prepare
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SCORE: ${{ inputs.min-score }}
        COMMENT: ${{ inputs.comment }}
        DIFF_ONLY: ${{ inputs.diff-only }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        case "$FAIL_ON" in
          error|warning|off) ;;
          *) echo "::error::Invalid fail-on. Use error, warning, or off."; exit 1 ;;
        esac
        if ! [[ "$MIN_SCORE" =~ ^([0-9]|[1-9][0-9]|100)$ ]]; then
          echo "::error::Invalid min-score. Use an integer from 0 to 100."
          exit 1
        fi
        for BOOLEAN_INPUT in "$COMMENT" "$DIFF_ONLY" "$UPLOAD_SARIF"; do
          case "$BOOLEAN_INPUT" in
            true|false) ;;
            *) echo "::error::Boolean inputs must be true or false."; exit 1 ;;
          esac
        done
        REPORT_DIRECTORY=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/astro-doctor.XXXXXXXX")
        echo "directory=$REPORT_DIRECTORY" >> "$GITHUB_OUTPUT"
        echo "json_path=$REPORT_DIRECTORY/report.json" >> "$GITHUB_OUTPUT"

    - name: Detect changed Astro Doctor files (PR diff mode)
      id: diff
      if: github.event_name == 'pull_request' && inputs.diff-only == 'true'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        CHANGED_FILES=$(git -C "$WORKING_DIRECTORY" diff --name-only --diff-filter=AMR --relative "$BASE_SHA"...HEAD)

        if ! grep -E '(\.astro$|\.(ts|js|mjs|mts)$|(^|/)astro\.config\.(ts|mjs|js|cjs|mts|cts)$|(^|/)package\.json$|(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|bun\.lock|bun\.lockb)$|(^|/)\.env\.example$|(^|/)src/content\.config\.(ts|mjs|js)$|(^|/)src/content/config\.(ts|mjs|js)$|(^|/)src/content/|(^|/)src/actions/)' \
          <<< "$CHANGED_FILES" > /dev/null; then
          echo "no_astro_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Skip scan (no Astro Doctor changes)
      if: steps.diff.outputs.no_astro_changes == 'true'
      shell: bash
      run: |
        echo "No Astro Doctor relevant files changed in this PR — skipping Astro Doctor scan."

    - name: Run Astro Doctor scan
      id: scan
      if: steps.diff.outputs.no_astro_changes != 'true'
      shell: bash
      env:
        JSON_REPORT_PATH: ${{ steps.prepare.outputs.json_path }}
        FAIL_ON: ${{ inputs.fail-on }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        EVENT_NAME: ${{ github.event_name }}
        DIFF_ONLY: ${{ inputs.diff-only }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        JSON_FLAG=(--json "$JSON_REPORT_PATH")
        FAIL_FLAG=(--fail-on "$FAIL_ON")
        DIR_FLAG=(--dir "$WORKING_DIRECTORY")
        CHANGED_FLAG=()

        if [ "$EVENT_NAME" = "pull_request" ] && [ "$DIFF_ONLY" = "true" ]; then
          CHANGED_FLAG=(--scope changed --base "$BASE_SHA")
        fi

        set +e
        if [ -f "$GITHUB_ACTION_PATH/packages/astro-doctor/dist/bin/astro-doctor.js" ]; then
          echo "Using local built Astro Doctor from $GITHUB_ACTION_PATH"
          node "$GITHUB_ACTION_PATH/packages/astro-doctor/dist/bin/astro-doctor.js" "${DIR_FLAG[@]}" "${JSON_FLAG[@]}" "${FAIL_FLAG[@]}" "${CHANGED_FLAG[@]}"
        else
          PACKAGE_VERSION=$(node -p 'require(process.env.GITHUB_ACTION_PATH + "/packages/astro-doctor/package.json").version')
          npx --yes "@santi020k/astro-doctor@$PACKAGE_VERSION" "${DIR_FLAG[@]}" "${JSON_FLAG[@]}" "${FAIL_FLAG[@]}" "${CHANGED_FLAG[@]}"
        fi
        SCAN_STATUS=$?
        set -e

        echo "exit_code=$SCAN_STATUS" >> "$GITHUB_OUTPUT"

    - name: Parse report and set outputs
      id: report
      shell: bash
      env:
        NO_ASTRO_CHANGES: ${{ steps.diff.outputs.no_astro_changes }}
        JSON_REPORT_PATH: ${{ steps.prepare.outputs.json_path }}
      run: |
        if [ "$NO_ASTRO_CHANGES" = "true" ]; then
          echo "scan_failed=false" >> "$GITHUB_OUTPUT"
          echo "total=0" >> "$GITHUB_OUTPUT"
          echo "errors=0" >> "$GITHUB_OUTPUT"
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          echo "score=100" >> "$GITHUB_OUTPUT"
          echo "score_label=S" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ ! -f "$JSON_REPORT_PATH" ] || ! jq -e '
          (.errorCount | type == "number" and . >= 0 and . == floor) and
          (.warningCount | type == "number" and . >= 0 and . == floor) and
          (.fileCount | type == "number" and . >= 0 and . == floor) and
          (.score | type == "number" and . >= 0 and . <= 100 and . == floor) and
          (.scoreLabel | . == "S" or . == "A" or . == "B" or . == "C" or . == "D" or . == "F") and
          (.diagnostics | type == "array")
        ' "$JSON_REPORT_PATH" > /dev/null; then
          echo "scan_failed=true" >> "$GITHUB_OUTPUT"
          echo "total=0" >> "$GITHUB_OUTPUT"
          echo "errors=0" >> "$GITHUB_OUTPUT"
          echo "warnings=0" >> "$GITHUB_OUTPUT"
          echo "score=0" >> "$GITHUB_OUTPUT"
          echo "score_label=F" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "scan_failed=false" >> "$GITHUB_OUTPUT"
        TOTAL=$(jq '.errorCount + .warningCount' "$JSON_REPORT_PATH")
        ERRORS=$(jq '.errorCount' "$JSON_REPORT_PATH")
        WARNINGS=$(jq '.warningCount' "$JSON_REPORT_PATH")
        SCORE=$(jq '.score' "$JSON_REPORT_PATH")
        LABEL=$(jq -r '.scoreLabel' "$JSON_REPORT_PATH")

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
        echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "score_label=$LABEL" >> "$GITHUB_OUTPUT"

    - name: Copy JSON report to requested path
      if: inputs.json-report != '' && steps.diff.outputs.no_astro_changes != 'true' && steps.report.outputs.scan_failed != 'true'
      shell: bash
      env:
        JSON_REPORT_PATH: ${{ steps.prepare.outputs.json_path }}
        DESTINATION_PATH: ${{ inputs.json-report }}
      run: |
        mkdir -p -- "$(dirname -- "$DESTINATION_PATH")"
        cp -- "$JSON_REPORT_PATH" "$DESTINATION_PATH"

    - name: Generate SARIF report
      id: sarif
      if: |
        steps.diff.outputs.no_astro_changes != 'true' &&
        steps.report.outputs.scan_failed != 'true' &&
        (inputs.sarif-report != '' || inputs.upload-sarif == 'true')
      shell: bash
      env:
        SARIF_PATH: ${{ inputs.sarif-report }}
        REPORT_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        EVENT_NAME: ${{ github.event_name }}
        DIFF_ONLY: ${{ inputs.diff-only }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -z "$SARIF_PATH" ]; then
          SARIF_PATH="$REPORT_DIRECTORY/report.sarif"
        fi

        mkdir -p "$(dirname "$SARIF_PATH")"

        DIR_FLAG=(--dir "$WORKING_DIRECTORY")
        CHANGED_FLAG=()

        if [ "$EVENT_NAME" = "pull_request" ] && [ "$DIFF_ONLY" = "true" ]; then
          CHANGED_FLAG=(--scope changed --base "$BASE_SHA")
        fi

        if [ -f "$GITHUB_ACTION_PATH/packages/astro-doctor/dist/bin/astro-doctor.js" ]; then
          node "$GITHUB_ACTION_PATH/packages/astro-doctor/dist/bin/astro-doctor.js" \
            "${DIR_FLAG[@]}" --format sarif --fail-on off "${CHANGED_FLAG[@]}" > "$SARIF_PATH"
        else
          PACKAGE_VERSION=$(node -p 'require(process.env.GITHUB_ACTION_PATH + "/packages/astro-doctor/package.json").version')
          npx --yes "@santi020k/astro-doctor@$PACKAGE_VERSION" \
            "${DIR_FLAG[@]}" --format sarif --fail-on off "${CHANGED_FLAG[@]}" > "$SARIF_PATH"
        fi

        echo "path=$SARIF_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && steps.sarif.outputs.path != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.33.0
      with:
        sarif_file: ${{ steps.sarif.outputs.path }}

    - name: Publish workflow annotations
      if: steps.diff.outputs.no_astro_changes != 'true' && steps.report.outputs.scan_failed != 'true'
      shell: bash
      env:
        JSON_REPORT_PATH: ${{ steps.prepare.outputs.json_path }}
      run: |
        node --input-type=module <<'EOF'
        import { readFileSync } from 'node:fs'

        const report = JSON.parse(readFileSync(process.env.JSON_REPORT_PATH, 'utf8'))
        const escapeData = (value) => String(value)
          .replaceAll('%', '%25')
          .replaceAll('\r', '%0D')
          .replaceAll('\n', '%0A')
        const escapeProperty = (value) => escapeData(value)
          .replaceAll(':', '%3A')
          .replaceAll(',', '%2C')

        for (const diagnostic of report.diagnostics) {
          const level = diagnostic.severity === 'error' ? 'error' : 'warning'
          const title = diagnostic.ruleId.replace('astro-doctor/', '')
          const properties = [
            `file=${escapeProperty(diagnostic.filePath)}`,
            `line=${diagnostic.line}`,
            `col=${diagnostic.column}`,
            `title=${escapeProperty(title)}`,
          ].join(',')

          console.log(`::${level} ${properties}::${escapeData(diagnostic.message)}`)
        }
        EOF

    - name: Post PR summary comment
      if: |
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        inputs.comment == 'true' &&
        steps.diff.outputs.no_astro_changes != 'true' &&
        steps.report.outputs.scan_failed != 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        JSON_REPORT_PATH: ${{ steps.prepare.outputs.json_path }}
        EVENT_NAME: ${{ github.event_name }}
        DIFF_ONLY: ${{ inputs.diff-only }}
      with:
        script: |
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync(process.env.JSON_REPORT_PATH, 'utf8'))

          const scoreEmoji = { S: '🌟', A: '✅', B: '🟢', C: '🟡', D: '🟠', F: '🔴' }[report.scoreLabel] ?? '🟡'
          const diffMode = process.env.EVENT_NAME === 'pull_request' && process.env.DIFF_ONLY === 'true'
          const scopeNote = diffMode ? ' _(introduced issues only)_' : ''
          const escapeCell = value => String(value)
            .replaceAll('|', '\\|')
            .replaceAll('\r', '')
            .replaceAll('\n', '<br>')

          const rows = report.diagnostics.slice(0, 25).map(d => {
            const rel = d.filePath.replace(`${process.env.GITHUB_WORKSPACE}/`, '')
            const icon = d.severity === 'error' ? '🔴' : '🟡'
            return `| ${icon} | \`${escapeCell(rel)}\` | ${d.line}:${d.column} | ${escapeCell(d.message)} | \`${escapeCell(d.ruleId.replace('astro-doctor/', ''))}\` |`
          }).join('\n')

          const truncated = report.diagnostics.length > 25
            ? `\n> ⚠ Showing 25 of ${report.diagnostics.length} diagnostics. Run \`pnpm dlx @santi020k/astro-doctor@latest\` locally to see all.`
            : ''

          const issuesSection = report.errorCount + report.warningCount === 0
            ? '**No issues found!** 🎉'
            : `| | File | Location | Message | Rule |\n|---|---|---|---|---|\n${rows}${truncated}`

          const body = [
            `<!-- astro-doctor-comment -->`,
            `## Astro Doctor ${scoreEmoji} ${report.score}/100 (${report.scoreLabel})${scopeNote}`,
            '',
            issuesSection,
            '',
            `**${report.errorCount} error${report.errorCount === 1 ? '' : 's'}, ${report.warningCount} warning${report.warningCount === 1 ? '' : 's'}** across ${report.fileCount} file${report.fileCount === 1 ? '' : 's'}`,
            '',
            `<sub>Powered by [Astro Doctor](https://github.com/santi020k/astro-doctor)</sub>`,
          ].join('\n')

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })

          const existing = comments.find(c => c.body?.includes('<!-- astro-doctor-comment -->'))

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
          }

    - name: Fail check on violations
      if: steps.diff.outputs.no_astro_changes != 'true'
      shell: bash
      env:
        SCAN_FAILED: ${{ steps.report.outputs.scan_failed || 'false' }}
        SCAN_STATUS: ${{ steps.scan.outputs.exit_code || '1' }}
        ERRORS: ${{ steps.report.outputs.errors || '0' }}
        WARNINGS: ${{ steps.report.outputs.warnings || '0' }}
        SCORE: ${{ steps.report.outputs.score || '0' }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SCORE: ${{ inputs.min-score }}
      run: |
        if [ "$SCAN_FAILED" = "true" ]; then
          echo "::error::Astro Doctor scan did not produce a valid report."
          exit 1
        fi

        if [ "$SCORE" -lt "$MIN_SCORE" ]; then
          echo "::error::Astro Doctor score $SCORE/100 is below the minimum of $MIN_SCORE."
          exit 1
        fi

        if [ "$FAIL_ON" = "error" ] && [ "$ERRORS" -gt 0 ]; then
          echo "::error::Astro Doctor found $ERRORS error(s). Fix them or set fail-on: 'off'."
          exit 1
        fi

        if [ "$FAIL_ON" = "warning" ] && [ $((ERRORS + WARNINGS)) -gt 0 ]; then
          echo "::error::Astro Doctor found $((ERRORS + WARNINGS)) issue(s). Fix them or set fail-on: 'error'."
          exit 1
        fi

        if [ "$SCAN_STATUS" -ne 0 ]; then
          echo "::error::Astro Doctor exited unsuccessfully."
          exit "$SCAN_STATUS"
        fi

    - name: Clean temporary reports
      if: always() && steps.prepare.outputs.directory != ''
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: rm -rf -- "$REPORT_DIRECTORY"

branding:
  icon: activity
  color: orange
