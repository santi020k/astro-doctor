name: Compatibility

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compatibility
  cancel-in-progress: true

jobs:
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.16.0, 26.3.0]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build && pnpm run typecheck && pnpm run test

  windows:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build serially
        run: pnpm exec turbo run build --concurrency=1 --output-logs=new-only
      - name: Run Windows scanner smoke test
        run: pnpm --filter @santi020k/astro-doctor exec vitest run tests/scanner/file-discovery.test.ts --maxWorkers=1
