name: Compatibility

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compatibility
  cancel-in-progress: true

jobs:
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.16.0, 26.3.0]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm run build && pnpm run typecheck && pnpm run test

  windows:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.22.3
      - name: Build serially
        run: pnpm exec turbo run build --concurrency=1 --output-logs=new-only
      - name: Run Windows scanner smoke test
        run: pnpm --filter @santi020k/astro-doctor exec vitest run tests/scanner/file-discovery.test.ts --maxWorkers=1
