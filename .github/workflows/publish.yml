name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@santi020k/astro-doctor
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-compatible npm
        run: |
          pnpm add --global npm@11.20.0
          npm --version

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release
          version: pnpm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
          commitMode: github-api
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || github.token }}

      - name: Determine release readiness
        id: release-ready
        run: |
          VERSION=$(node -p "require('./packages/astro-doctor/package.json').version")
          TAG="@santi020k/astro-doctor@${VERSION}"
          TAG_SHA=$(git ls-remote --refs --tags origin "refs/tags/${TAG}" | cut -f1)

          if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify published CLI package
        if: steps.release-ready.outputs.ready == 'true'
        run: |
          VERSION=$(node -p "require('./packages/astro-doctor/package.json').version")
          PUBLISHED_VERSION=$(pnpm dlx "@santi020k/astro-doctor@${VERSION}" --version)

          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "Expected published CLI version ${VERSION}, received ${PUBLISHED_VERSION}."
            exit 1
          fi

      - name: Create umbrella version tag
        if: steps.release-ready.outputs.ready == 'true'
        run: |
          VERSION=$(node -p "require('./packages/astro-doctor/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

          RELEASE_SHA=$(git rev-list -n 1 "v${VERSION}")
          git tag -fa v1 "$RELEASE_SHA" -m "Update v1 to v${VERSION}"
          git push --force origin refs/tags/v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish VS Code Extension
        if: steps.release-ready.outputs.ready == 'true'
        run: pnpm run publish:ext
        working-directory: packages/vscode-astro-doctor
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
