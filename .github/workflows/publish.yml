name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Check release state
        id: release_state
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release_state.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Version packages
        if: steps.release_state.outputs.should_publish == 'true'
        run: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release artifacts
        if: steps.release_state.outputs.should_publish == 'true'
        run: |
          if git diff --quiet; then
            echo "No release artifacts to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): version packages"
          git push origin HEAD:main

      - name: Publish packages
        if: steps.release_state.outputs.should_publish == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: true
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published CLI package
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/astro-doctor/package.json').version")
          PUBLISHED_VERSION=$(pnpm dlx "@santi020k/astro-doctor@${VERSION}" --version)

          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "Expected published CLI version ${VERSION}, received ${PUBLISHED_VERSION}."
            exit 1
          fi

      - name: Create umbrella version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/astro-doctor/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

          RELEASE_SHA=$(git rev-list -n 1 "v${VERSION}")
          git tag -fa v1 "$RELEASE_SHA" -m "Update v1 to v${VERSION}"
          git push --force origin refs/tags/v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish VS Code Extension
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run publish:ext
        working-directory: packages/vscode-astro-doctor
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
