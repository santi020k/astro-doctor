name: CI

on:
  pull_request:
    branches: [main, "release/v*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      TURBO_TEAM:
        required: false
      TURBO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.22.3

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=moderate

      - name: Plan repository checks
        id: scope
        run: pnpm run ci:plan

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitprompt validate --input -

      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since="$QUALITY_CI_BASE"

      - name: Validate repository
        run: pnpm run ci:check

      - name: Install documentation test browser
        if: steps.scope.outputs.docs == 'true'
        run: pnpm --filter @santi020k/astro-doctor-docs exec playwright install --with-deps chromium

      - name: Check documentation routes and interactions
        if: steps.scope.outputs.docs == 'true'
        run: pnpm --filter @santi020k/astro-doctor-docs exec playwright test
