name: CI

on:
  pull_request:
    branches: [main, "release/v*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      TURBO_TEAM:
        required: false
      TURBO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Pull request metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.23.4

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitprompt validate --input -

      - name: Verify consumed release metadata
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: node scripts/release-metadata.mjs "$RELEASE_BRANCH"

      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'release/v')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm changeset status --since="$BASE_SHA"

  impact-plan:
    name: Quality v2 shadow plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pinned Quality
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh \
            --output "$RUNNER_TEMP/install-quality.sh"
          QUALITY_INSTALL_DIR="$RUNNER_TEMP/quality-bin" sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality v2.0.0
          echo "$RUNNER_TEMP/quality-bin" >> "$GITHUB_PATH"
      - name: Record committed-source impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REF" != release/* && "$HEAD_REF" != changeset-release/* && -n "$BASE_SHA" ]]; then
            quality impact plan --base "$BASE_SHA" --head HEAD --format json > "$RUNNER_TEMP/quality-impact.json"
          else
            quality impact plan --full --format json > "$RUNNER_TEMP/quality-impact.json"
          fi
      - name: Verify policy regression fixtures
        run: node --test scripts/quality-impact.node-test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-impact-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-impact.json
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: metadata
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.23.4
          task-cache-path: .turbo/cache
          task-cache-key: astro-doctor-checks

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - name: Validate repository
        run: pnpm run ci:check

  docs-e2e:
    needs: metadata
    name: Documentation browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.23.4
          task-cache-path: .turbo/cache
          task-cache-key: astro-doctor-docs-e2e

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - name: Plan repository checks
        id: scope
        run: pnpm run ci:plan

      - name: Resolve documentation test browser version
        if: steps.scope.outputs.docs == 'true'
        id: playwright
        run: |
          set -euo pipefail
          VERSION=$(pnpm --filter @santi020k/astro-doctor-docs exec node -p "require('@playwright/test/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore documentation test browser
        if: steps.scope.outputs.docs == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install documentation test browser
        if: steps.scope.outputs.docs == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @santi020k/astro-doctor-docs exec playwright install --with-deps chromium

      - name: Install documentation test browser system dependencies
        if: steps.scope.outputs.docs == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @santi020k/astro-doctor-docs exec playwright install-deps chromium

      - name: Build documentation
        if: steps.scope.outputs.docs == 'true'
        run: pnpm exec turbo run build --filter=@santi020k/astro-doctor-docs...

      - name: Check documentation routes and interactions
        if: steps.scope.outputs.docs == 'true'
        run: pnpm --filter @santi020k/astro-doctor-docs exec playwright test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.23.4
          cache: "false"
          install: "false"

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=moderate

  gate:
    name: Required checks
    if: always()
    needs: [metadata, validate, impact-plan, docs-e2e, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation, planning and documentation checks
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PLAN_RESULT: ${{ needs.impact-plan.result }}
          DOCS_RESULT: ${{ needs.docs-e2e.result }}
        run: test "$METADATA_RESULT" = success && test "$AUDIT_RESULT" = success && test "$VALIDATION_RESULT" = success && test "$PLAN_RESULT" = success && test "$DOCS_RESULT" = success
