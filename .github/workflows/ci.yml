name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.19.0, 22.22.3, 24.16.0, 26.3.0]

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: matrix.node-version != '20.19.0'
        run: pnpm run build

      - name: Build published packages (minimum Node.js runtime)
        if: matrix.node-version == '20.19.0'
        run: pnpm exec turbo run build --filter='!@santi020k/astro-doctor-docs'

      - name: Run CI checks (minimum Node.js runtime)
        if: matrix.node-version == '20.19.0'
        run: pnpm exec turbo run typecheck lint test:coverage --filter='!@santi020k/astro-doctor-docs'

      - name: Run CI checks
        if: matrix.node-version != '20.19.0'
        run: pnpm exec turbo run typecheck lint test:coverage

      - name: Run repository checks
        if: matrix.node-version == '22.22.3'
        run: pnpm exec turbo run //#lint:spell //#lint:knip //#lint:repo

      - name: Check exports
        if: matrix.node-version == '20.19.0'
        run: pnpm exec turbo run check:exports --filter='!@santi020k/astro-doctor-docs'

      - name: Check packed npm install
        if: matrix.node-version == '20.19.0'
        run: pnpm run check:packed-install

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (serialised to avoid native-binary contention on Windows)
        run: pnpm exec turbo run build --concurrency=1 --output-logs=new-only

      - name: Run scanner tests on Windows
        run: pnpm --filter @santi020k/astro-doctor exec vitest run tests/scanner/file-discovery.test.ts --maxWorkers=1
