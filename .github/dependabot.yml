version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "skip-changelog"
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Changesets v3 requires a coordinated migration to changesets/action v2.
      - dependency-name: "@changesets/cli"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@changesets/changelog-github"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type: ci"
      - "skip-changelog"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # v2 requires Changesets CLI v3 and a coordinated release migration.
      - dependency-name: "changesets/action"
        update-types:
          - "version-update:semver-major"
